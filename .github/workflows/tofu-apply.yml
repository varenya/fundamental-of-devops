name: Tofu Apply

on:
  pull_request:
    branches: ["main"]
    paths: ["ch5/tofu/live/lambda-sample/**"]

jobs:
  plan:
    name: "Tofu Apply"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v2

      - uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: "arn:aws:iam::060795927723:role/lambda-sample-apply"
          role-session-name: plan-${{ github.run_number }}-${{ github.actor }}
          region: us-east-2

      - uses: opentofu/setup-opentofu@v1

      - name: tofu apply
        id: plan
        working-directory: ch5/tofu/live/lambda-sample
        run: |
          tofu init -no-color -input=false
          tofu apply -no-color -input=false -lock=false

     - uses: peter-evans/create-or-update-comment@v4                       
        if: always()
        env:
          RESULT_EMOJI: ${{ steps.apply.outcome == 'success' && '✅' || '⚠️' }}
        with:
          issue-number: ${{ steps.find_pr.outputs.number }}
          body: |
            ## ${{ env.RESULT_EMOJI }} `tofu apply` output
            ```${{ steps.plan.outputs.stdout }}```
