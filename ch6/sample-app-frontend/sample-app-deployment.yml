apiVersion: apps/v1
kind: Deployment 
metadata:
  name: sample-app-front-deployment
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: sample-app-frontend-pods
    spec:
      containers:
        - name: sample-app-frontend
          image: sample-app-frontend:0.0.1
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0

  selector:
    matchLabels:
      app: sample-app-frontend-pods
